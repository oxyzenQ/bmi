[package]
name = "bmi-stellar-argon2id"
version = "1.0.0"
edition = "2021"
# The MSRV floor pins the same surface the toolchain channel pins (the
# version-sync gate, scripts/gates/check-rust-version-sync.sh, ties all
# three surfaces together: channel, MSRV, and the maintenance workflow).
rust-version = "1.100.0"
license = "AGPL-3.0-only"
description = "The bmi-stellar Argon2id key-derivation engine compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact-pin, the arrayref lesson (night-supply-1): the direct dependency
# can never ride a semver-compatible republish into the build - only the
# owner's deliberate edit moves this line. Transitive versions stay
# pinned by the committed Cargo.lock, refresh under the cargo-deny
# structural policy (deny.toml) and the wasm parity gate, and the
# advisory DB watches the tree weekly.
argon2 = { version = "=0.6.0", default-features = false, features = ["kdf"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
