[package]
name = "bmi-stellar-argon2id"
version = "80.6.2"
edition = "2021"
# The MSRV floor pins the same surface the toolchain channel pins (the
# version-sync gate, scripts/gates/check-rust-version-sync.sh, ties all
# three surfaces together: channel, MSRV, and the maintenance workflow).
rust-version = "1.100.0"
# The commercial seat rides the ISO SPDX LicenseRef- form: bare
# "Commercial" is not a valid SPDX term and this field is machine-
# validated as an SPDX expression (cargo-deny, the registry). The file
# headers keep the human-readable "OR Commercial" spelling.
license = "AGPL-3.0-only OR LicenseRef-Commercial"
description = "The bmi-stellar Argon2id key-derivation engine compiled to WebAssembly"
authors = ["rezky_nightky (oxyzenQ) <oxyzenQ@proton.me>"]
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact-pin, the arrayref lesson (night-supply-1): the direct dependency
# can never ride a semver-compatible republish into the build - only the
# owner's deliberate edit moves this line. Transitive versions stay
# pinned by the committed Cargo.lock, refresh under the cargo-deny
# structural policy (deny.toml) and the wasm parity gate, and the
# advisory DB watches the tree weekly.
argon2 = { version = "=0.6.0", default-features = false, features = ["kdf"] }
# The keystore seat's HMAC-SHA256 (night-frontier-Z6): the RustCrypto
# pair, exact-pinned under the same rule - the engine-side tag must be
# byte-identical to the noble fallback path the JS battery pins. The
# digest-0.10 pair is deliberate: it compiles clean, keeps the
# artifact under the ceiling, and its four duplicated digest-ecosystem
# crates (block-buffer, cpufeatures, crypto-common, digest - argon2's
# blake2 rides the 0.11 majors) are accepted in deny.toml as exact-pin
# bounded, no_std, single-crate-seat exceptions with the honest reason
# recorded there.
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
# The seal seat's AES-256-GCM (night-frontier-Z8): the RustCrypto AEAD,
# exact-pinned under the same rule - the engine-side ciphertext and tag
# must be byte-identical to the WebCrypto fallback path the parity
# battery pins (same key, nonce, plaintext, and associated data produce
# the same bytes; both sides implement the standard GCM construction).
# default-features = false keeps the seat no_std and deterministic: the
# detached in-place APIs need no allocator, no RNG, and no hashbrown.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
