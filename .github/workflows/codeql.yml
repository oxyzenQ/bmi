---
name: 'Stellar Guard - CodeQL'

on:
  push:
  pull_request:
  schedule:
    # Weekly at 03:00 UTC (10:00 WIB) every Monday. Deliberately off the
    # 00:00 Monday slot: self-heal and maintenance already fire there, and
    # 00:00 Monday is GitHub's most congested schedule window where
    # best-effort cron runs queue longest or get dropped. The push and
    # pull_request triggers above remain the primary lanes; this schedule
    # is the no-pushes-during-dormancy backstop.
    - cron: '0 3 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4, SHA pin
        with:
          languages: ${{ matrix.language }}
          # Auto-detect queries (security and quality)
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4, SHA pin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@52cf1852265d99e9bea071b03366fc777a602909 # codeql-bundle-v2.27.4, SHA pin
        with:
          category: '/language:${{matrix.language}}'
          upload: true
