---
name: Stellar Guard - Proofs

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theorem:
    name: For-all - ${{ matrix.harness }}
    # The for-all tier (night-netrunner-Z2): one invocation per harness,
    # so a verdict is never lost to a sibling's budget. Every harness
    # quantifies over its law's full stated finite domain and finishes
    # in seconds; the ten-minute ceiling is the estate cap, not the
    # expectation.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        harness:
          - classifier-for-all
          - clamp-display-for-all
          - bytes-hex-for-all
          - crack-time-ladder-for-all
          - at-rest-decisions-for-all
          - envelope-kdf-gate-for-all
          - kdf-ladder-floor-for-all
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: 26

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Theorem verdict - ${{ matrix.harness }}
        run: bun run test:proofs -- proofs/${{ matrix.harness }}.test.ts

  census-guard:
    name: Census guard (the absence seat)
    # The seat that runs no harness at all: it re-reads the tier table
    # out of the tree and fails loudly the day a harness, a source law,
    # or a lane seat goes missing - the honest NOs are enforced, not
    # merely archived.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: 26

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Re-read the tier table out of the tree
        run: bun run audit:proof-manifest
