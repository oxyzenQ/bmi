---
# .github/workflows/self-heal-actions.yml
#
# Purpose:
# - Heal every GitHub Actions `uses:` version pin to the latest release
#   commit SHA (the zelynic-aligned actions-pin engine, run through
#   scripts/ci/actions-version-sweep.sh --apply; annotated tags peeled,
#   the release tag kept as a trailing "# vX.Y.Z, SHA pin" comment)
# - Commit as the repository owner and push to the default branch
#
# Security/minimality notes:
# - Uses a Personal Access Token (PAT) with `workflow` scope to update
#   workflow files.
# - The sweep's fail-closed guard proves its writes stayed inside
#   .github/workflows/ before anything is committed.
# - Runs on schedule/manual only - it never runs on push events, so it
#   cannot loop on its own commits. Exits cleanly when every pin is
#   already current.

name: Stellar Guard - Actions Self-Heal

# This workflow runs once a week on Monday at 00:00 UTC (07:00 WIB).
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

concurrency:
  group: self-heal-actions
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Repository owner identity (must match the owner so contributions show up).
  OWNER_NAME: oxyzenQ
  OWNER_EMAIL: 130107241+oxyzenQ@users.noreply.github.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Detect default branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          echo "name=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.PAT_WORKFLOW }}
          fetch-depth: 1
          fetch-tags: false

      - name: Heal actions pins to the latest release SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash scripts/ci/actions-version-sweep.sh --apply

      - name: Commit and push healed pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${OWNER_NAME}"
          git config user.email "${OWNER_EMAIL}"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No healed pins; nothing to commit."
            exit 0
          fi

          git add .github/workflows

          if git diff --cached --quiet; then
            echo "No staged changes; skipping commit."
            exit 0
          fi

          git commit -m "Internal research: heal GitHub Actions pins to the latest release SHAs (self-heal-actions)"

          # Retry the push against upstream movement. Between attempts, fetch
          # and rebase so a concurrent commit does not wedge the update. If
          # every attempt fails, exit non-zero: a silently skipped self-heal
          # push must not look like a successful run.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ steps.branch.outputs.name }}"; then
              pushed=1
              break
            fi
            echo "Push attempt ${attempt} failed; fetching and rebasing before retry..."
            if ! git fetch origin "${{ steps.branch.outputs.name }}"; then
              echo "Fetch failed; cannot rebase. Retrying in 5 seconds..."
              sleep 5
              continue
            fi
            if git rebase "origin/${{ steps.branch.outputs.name }}"; then
              echo "Rebased onto origin/${{ steps.branch.outputs.name }}."
            else
              echo "Rebase failed; aborting. The self-heal commit conflicts with upstream changes."
              git rebase --abort
              break
            fi
            sleep 5
          done

          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::Failed to push the self-heal commit after 3 attempts."
            exit 1
          fi
