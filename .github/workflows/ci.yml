---
name: Stellar Guard - CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26
  VERCEL_NODE_RUNTIME: nodejs26.x

jobs:
  ci:
    name: Build & Test
    # Pinned to ubuntu-26.04 explicitly: the ubuntu-latest label migrates to
    # Ubuntu 26.04 between Oct 19 and Nov 19, 2026 (runner-images #14748), and
    # 24.04 ages out eventually - this repo rides the new LTS by pin instead
    # of inheriting label drift.
    runs-on: ubuntu-26.04
    # Full gate (audit, format, loc, headers, branding, pwa, typecheck,
    # lint, test, build) takes ~5 min; 10 caps a hung runner at 2x.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit:deps

      - name: Format check
        run: bun run format:check

      - name: LOC check
        run: bun run audit:loc

      - name: Scripts LOC check
        run: bash scripts/gates/check-scripts-loc.sh

      - name: Header check
        run: bun run audit:headers

      - name: Version sync check
        run: bun run audit:version-sync

      - name: Branding check
        run: bun run audit:branding

      - name: Signature check
        run: bun run audit:signature

      - name: PWA offline-shell check
        run: bun run audit:pwa-offline

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:ci

      - name: Build
        run: bun run build

  wasm-provenance:
    name: Rust engine provenance
    # The committed embedded artifact must be the built artifact: this
    # lane rebuilds engine/argon2id (toolchain pinned in
    # rust-toolchain.toml, rustup resolves it on the runner) and demands
    # fresh build == recorded digest == embedded base64. Byte-reproducible
    # by path remapping, so any machine produces the same bytes. The
    # formatting and clippy gates ride the same pinned toolchain (the
    # zelynic per-push Rust quality shape): the engine is the one Rust
    # seat in the tree and every push that touches anything proves the
    # whole artifact chain, not just the digest.
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Cache cargo registry and engine target tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/argon2id/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('engine/argon2id/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Verify the wasm artifact against the committed crate
        run: bash scripts/ci/wasm-provenance.sh

      - name: Rust formatting gate
        run: (cd engine/argon2id && cargo fmt --all -- --check)

      - name: Rust clippy gate
        run: (cd engine/argon2id && cargo clippy --all-targets -- -D warnings)

      - name: Install cargo-deny (digest-pinned scanner)
        run: bash scripts/ci/install-cargo-deny.sh

      - name: Dependency policy gate (bans and sources)
        # The arrayref structural policy (engine/argon2id/deny.toml),
        # blocking on every push: no git source, no unknown registry, no
        # duplicate versions, no wildcards. The scanner binary is
        # verified against a committed digest before it is trusted.
        run: (cd engine/argon2id && cargo deny check bans sources)
