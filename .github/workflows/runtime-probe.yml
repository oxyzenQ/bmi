---
name: Stellar Guard - Runtime Probe

on:
  schedule:
    # Weekly at 03:00 UTC on Sunday (10:00 WIB), the shared guardian
    # anchor.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      candidates:
        description: Space-separated future Node majors to probe
        type: string
        default: '24 26 28'

permissions:
  contents: write

concurrency:
  group: runtime-probe
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OWNER_NAME: oxyzenQ
  OWNER_EMAIL: 130107241+oxyzenQ@users.noreply.github.com
  RUNTIME_CANDIDATES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.candidates || '24 26 28' }}

jobs:
  runtime-probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Detect default branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          echo "name=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"

      - name: Prove PAT_WORKFLOW is alive and push-capable
        shell: bash
        env:
          PAT_WORKFLOW: ${{ secrets.PAT_WORKFLOW }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_WORKFLOW:-}" ]]; then
            echo "::error::PAT_WORKFLOW resolves to an empty string - the secret is missing or renamed. Mint a PAT with contents:write and workflows:write and store it as the repository secret PAT_WORKFLOW."
            exit 1
          fi
          code="$(curl -sS -o /tmp/pat-probe.json -w '%{http_code}' -H "Authorization: Bearer ${PAT_WORKFLOW}" "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          echo "PAT_WORKFLOW probe against ${GITHUB_REPOSITORY}: HTTP ${code}"
          if [[ "${code}" == "401" ]]; then
            echo "::error::GitHub rejects PAT_WORKFLOW (HTTP 401) - the token expired or was revoked. Mint a fresh PAT (contents:write + workflows:write, this repository selected) and update the repository secret."
            exit 1
          fi
          if [[ "${code}" != "200" ]]; then
            echo "::error::PAT_WORKFLOW probe returned unexpected HTTP ${code} - check the token, its scopes, and repository selection."
            exit 1
          fi
          push="$(python3 -c "import json; print(json.load(open('/tmp/pat-probe.json')).get('permissions', {}).get('push', False))")"
          if [[ "${push}" != "True" ]]; then
            echo "::error::PAT_WORKFLOW authenticates but cannot push to ${GITHUB_REPOSITORY} (permissions.push is false). Grant contents:write and workflows:write and select this repository for the token."
            exit 1
          fi
          echo "PAT_WORKFLOW is alive and push-capable."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ secrets.PAT_WORKFLOW || secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          fetch-tags: false

      - name: Detect current runtime
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current="$(grep -m1 -E '^[[:space:]]+NODE_VERSION:[[:space:]]+[0-9]+' .github/workflows/ci.yml | awk '{print $2}')"

          if [ -z "$current" ]; then
            echo "Unable to detect NODE_VERSION from .github/workflows/ci.yml" >&2
            exit 1
          fi

          echo "node=$current" >> "$GITHUB_OUTPUT"
          echo "Current Node runtime: $current"

      - name: Setup current Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ steps.current.outputs.node }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe future runtime
        id: probe
        shell: bash
        run: |
          set -euo pipefail

          current="${{ steps.current.outputs.node }}"
          selected=""

          for candidate in ${RUNTIME_CANDIDATES}; do
            if ! [[ "$candidate" =~ ^[0-9]+$ ]]; then
              echo "Skipping invalid candidate: $candidate"
              continue
            fi

            if [ "$candidate" -le "$current" ]; then
              echo "Skipping Node $candidate because current runtime is Node $current."
              continue
            fi

            runtime="nodejs${candidate}.x"
            echo "Probing ${runtime}..."

            if VERCEL_NODE_RUNTIME="$runtime" bun run format:check \
              && VERCEL_NODE_RUNTIME="$runtime" bun run check \
              && VERCEL_NODE_RUNTIME="$runtime" bun run lint \
              && VERCEL_NODE_RUNTIME="$runtime" bun run test:ci \
              && VERCEL_NODE_RUNTIME="$runtime" bun run build; then
              selected="$candidate"
              break
            fi

            echo "Runtime ${runtime} is not ready yet."
          done

          if [ -z "$selected" ]; then
            {
              echo "upgraded=false"
            } >> "$GITHUB_OUTPUT"
            echo "No future runtime passed the quality gate."
            exit 0
          fi

          runtime="nodejs${selected}.x"
          echo "Selected future runtime: ${runtime}"

          sed -i -E "s/(NODE_VERSION:[[:space:]]*)[0-9]+/\1${selected}/g" .github/workflows/*.yml
          sed -i -E "s/(VERCEL_NODE_RUNTIME:[[:space:]]*)nodejs[0-9]+\.x/\1${runtime}/g" .github/workflows/*.yml

          {
            echo "node=$selected"
            echo "runtime=$runtime"
            echo "upgraded=true"
          } >> "$GITHUB_OUTPUT"

      - name: Format workflow files
        if: steps.probe.outputs.upgraded == 'true'
        # The LOCKED prettier (bun run format:workflows), never a runtime
        # registry fetch: an unpinned package download resolves to whatever
        # the registry serves that day - the arrayref execution hole,
        # closed by the supply-chain gate.
        run: bun run format:workflows

      - name: Check changed runtime files
        if: steps.probe.outputs.upgraded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows
          git diff --check

      - name: Commit runtime upgrade
        if: steps.probe.outputs.upgraded == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "${OWNER_NAME}"
          git config user.email "${OWNER_EMAIL}"

          git add .github/workflows

          if git diff --cached --quiet; then
            echo "No staged runtime changes."
            exit 0
          fi

          git commit -m "ci: upgrade Node runtime to ${{ steps.probe.outputs.runtime }}"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Runtime Probe"
            echo ""
            echo "Current Node: ${{ steps.current.outputs.node }}"
            echo "Candidates: ${RUNTIME_CANDIDATES}"
            echo "Strategy: direct to ${{ steps.branch.outputs.name }}"
            echo "Upgraded: ${{ steps.probe.outputs.upgraded || 'false' }}"

            if [ "${{ steps.probe.outputs.upgraded || 'false' }}" = "true" ]; then
              echo "Selected runtime: ${{ steps.probe.outputs.runtime }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
