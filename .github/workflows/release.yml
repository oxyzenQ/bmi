---
name: Stellar Guard - Release

on:
  push:
    tags:
      - 'v*'

permissions:
  # night-netrunner-Z1 (C3): attestations need the OIDC identity. The
  # contents: write grant stays (release creation); the attestation
  # flow is the only additional capability this workflow gains.
  contents: write
  id-token: write
  attestations: write

env:
  NODE_VERSION: 26
  VERCEL_NODE_RUNTIME: nodejs26.x

jobs:
  validate-tag:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Tag names are attacker-influenced input (anyone with write access can
      # create a ref). Every run: block consumes the tag through an `env:`
      # mapping, never through ${{ }} interpolation into the shell source, so
      # a crafted ref can never inject bash syntax before the validators run.
      - name: Validate tag format and classify the release channel
        id: ver
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          # Syntax only: vX.Y.Z (stable) or vX.Y.Z-<suffix> (pre-release).
          # Any '-' after the patch version is the whole pre-release
          # contract - no channel whitelist to maintain, the owner names
          # the suffix (beta.1, night.7, rc.2, whatever) and the release
          # page renders the Pre-release badge by itself.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid tag format: $TAG (expected v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<suffix>)"
            exit 1
          fi
          # The pre-release branch comes FIRST: a glob * crosses '-',
          # so a reversed order would classify every -suffix tag
          # stable (the zelynic night-dragon-1S lesson). After the
          # regex above the only possible '-' is the pre-release
          # separator.
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Validate tag matches package version
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG does not match package.json v${PACKAGE_VERSION}"
            exit 1
          fi

      # night-netrunner-Z1 (C3): the tag-signing contract. The depth
      # matrix inside the artifact names the owner's Ed25519 publisher
      # key, but the release channel itself was only as trustworthy as
      # the account pushing the tag: a MITM on the release page (or a
      # hijacked session) could re-cut archives and re-cut sidecars,
      # because every digest sidecar is regenerable by whoever holds
      # the bytes. A GPG-signed tag is the unforgeable binding: the
      # workflow refuses to publish when the tag ref does not carry a
      # good signature from the pinned key, so the anchor the artifact
      # claims and the channel that ships it verify under the same
      # discipline. Verification needs the owner's public key, which
      # is public material by definition - carried as a repository
      # secret (the owner's placement; the secret namespace is also
      # the natural home once the same key pair later signs artifacts)
      # with the plain repository variable accepted as the fallback,
      # so either tab works and rotation is a settings change plus a
      # workflow edit, both auditable.
      - name: Verify the tag is signed by the release key
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
          RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY || vars.RELEASE_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_GPG_PUBLIC_KEY}" ]; then
            echo "::error::RELEASE_GPG_PUBLIC_KEY is not set (repository secret or variable)."
            echo "::error::Set it to the armored public key of the release signing identity."
            echo "::error::Until then this workflow cannot prove tag provenance and must fail closed."
            exit 1
          fi
          echo "${RELEASE_GPG_PUBLIC_KEY}" | gpg --batch --import
          KEY_FPR="$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          echo "verifying ${TAG} against ${KEY_FPR}"
          # --verify on the tag ref: exits non-zero on a missing,
          # broken, or foreign signature. The good-signature grep is
          # the belt-and-braces form: gpg exit codes alone do not
          # distinguish "signed by someone else" from noise on every
          # gpg build.
          if ! git tag -v "${TAG}" 2>&1 | tee /tmp/tag-verify.log; then
            echo "::error::git tag -v failed for ${TAG} - the tag carries no valid signature"
            exit 1
          fi
          if ! grep -q "Good signature" /tmp/tag-verify.log; then
            echo "::error::no Good signature line for ${TAG} under the imported release key"
            exit 1
          fi
          echo "tag ${TAG} carries a good signature from the pinned release key"

  release:
    needs: validate-tag
    runs-on: ubuntu-26.04
    # Static build plus archive creation and release upload take ~5-8 min.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # night-netrunner-1: the release archives carry a BLAKE3 sidecar
      # (b3sum, the zelynic mature-release digest lane). Ubuntu 26.04
      # ships the b3sum package; the cargo install is the fallback for
      # any runner image that drops it.
      - name: Install b3sum (the BLAKE3 digest tool)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q b3sum || cargo install b3sum --locked
          b3sum --version

      - name: Build static project
        shell: bash
        run: |
          set -euo pipefail
          cp svelte.config.js svelte.config.js.vercel
          had_layout_ts=0
          if [ -f src/routes/+layout.ts ]; then
            had_layout_ts=1
            cp src/routes/+layout.ts src/routes/+layout.ts.vercel
          fi
          cleanup() {
            cp svelte.config.js.vercel svelte.config.js
            rm -f svelte.config.js.vercel
            if [ "$had_layout_ts" -eq 1 ]; then
              mv src/routes/+layout.ts.vercel src/routes/+layout.ts
            else
              rm -f src/routes/+layout.ts
            fi
          }
          trap cleanup EXIT
          printf 'export const prerender = true;\n' > src/routes/+layout.ts
          bun run build

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          if [ "${{ needs.validate-tag.outputs.prerelease }}" = "true" ]; then
            # Pre-release notes span from the previous tag of any
            # channel - users testing a pre-release build want the
            # changes since the last build.
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1)
          else
            # Stable notes span from the nearest previous STABLE tag:
            # skipped pre-releases never truncate a stable's changelog
            # (the stable after v80.0.0-night.1 still covers everything
            # since the previous stable release).
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+-' | head -n 1)
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            COMMITS=$(git log "${FIRST_COMMIT}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Both archive steps follow one contract: the archive must contain
      # what its name promises, verified by reading the finished zip
      # back. v80.0.0 shipped a build zip holding 12 documentation
      # files and zero application code with a perfectly valid SHA-512
      # - a checksum proves transport integrity, never archive
      # contents - because "cp -r build ... && cp package.json" lost
      # the whole && chain to a missing directory while later "|| true"
      # lines kept the step green. Every fallback below is explicit
      # and every missing artifact is a hard failure, never a silent
      # degradation.
      - name: Create source archive
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          STAGE="release-source"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r src "$STAGE/" && cp -r static "$STAGE/" && cp -r scripts "$STAGE/"
          cp -r .github "$STAGE/" 2>/dev/null || true
          cp -r docs "$STAGE/" 2>/dev/null || true
          cp -r assets "$STAGE/" 2>/dev/null || true
          # night-netrunner-1 (the F1 fix): the source zip must be a
          # self-verifying tree, so every file the verify suite reads
          # ships inside it - the config dotfiles first (.prettierrc,
          # .prettierignore, .gitignore were absent, so format:check
          # alone reported 202 style warnings on the zip as shipped),
          # then the law and license documents the gates grep
          # (BRANDING.md for audit:branding, .codespellrc and .yamllint
          # for the gate-keepers lane, .npmrc for bun install itself).
          # The list is explicit on purpose: an accidental extra file
          # in the repo root must not leak into the release, and a
          # forgotten must-have fails the manifest gate below instead
          # of shipping a zip that cannot pass its own verify.sh.
          for dotfile in \
            .prettierrc .prettierignore .gitignore .codespellrc \
            .npmrc .tool-versions .yamllint; do
            if [ -f "$dotfile" ]; then
              cp "$dotfile" "$STAGE/"
            else
              echo "FATAL: expected config dotfile $dotfile is missing from the checkout" >&2
              exit 1
            fi
          done
          cp -r .githooks "$STAGE/"
          cp package.json "$STAGE/"
          cp bun.lock "$STAGE/" 2>/dev/null || true
          cp svelte.config.js "$STAGE/" 2>/dev/null || true
          cp vite.config.ts "$STAGE/" 2>/dev/null || true
          cp tsconfig.json "$STAGE/" 2>/dev/null || true
          cp vitest.config.ts "$STAGE/" 2>/dev/null || true
          cp postcss.config.js "$STAGE/" 2>/dev/null || true
          cp eslint.config.js "$STAGE/" 2>/dev/null || true
          cp vercel.json "$STAGE/" 2>/dev/null || true
          cp verify.sh "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/"
          cp SECURITY.md "$STAGE/" 2>/dev/null || true
          # The license-law documents check-headers.ts and the branding
          # gate read: a zip without them fails verify far past the
          # format stage. Hard-fail on absence for the same reason as
          # the dotfiles above - the release contract is explicit.
          for doc in BRANDING.md DORMANT.md RULES.md NOTICE TRADEMARK.md; do
            if [ -f "$doc" ]; then
              cp "$doc" "$STAGE/"
            else
              echo "FATAL: expected document $doc is missing from the checkout" >&2
              exit 1
            fi
          done
          cd "$STAGE" && zip -qr "../bmi-stellar-source-${TAG}.zip" . && cd ..
          # Post-zip manifest gate (the v80.0.0 lesson: a checksum
          # proves transport integrity, never archive contents). The
          # zip must carry package.json AND the dotfiles the verify
          # suite depends on - the exact F1 gap, now enforced at
          # packaging time so it can never regress silently. The awk
          # extracts the archive path column, so the match is exact:
          # a "src/package.json" subpath can never satisfy the
          # root-level "package.json" requirement.
          MISSING=0
          for required in package.json .prettierrc .prettierignore .gitignore .npmrc BRANDING.md; do
            if ! unzip -l "bmi-stellar-source-${TAG}.zip" | awk 'NR > 3 { print $4 }' | grep -qx "$required"; then
              echo "FATAL: source zip does not contain ${required}" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          sha512sum "bmi-stellar-source-${TAG}.zip" > "bmi-stellar-source-${TAG}.zip.sha512sum"
          # night-netrunner-1: the three-digest release contract, the
          # zelynic mature-release lane - SHA-512 (classical) + BLAKE3
          # (b3sum, the fast modern lane) + SHAKE256 (quantum-resistant
          # extensible-output). One sidecar per digest per archive, so
          # a verifier can cross-check any lane independently.
          b3sum "bmi-stellar-source-${TAG}.zip" > "bmi-stellar-source-${TAG}.zip.b3sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          python3 -c "
          import hashlib
          data = open('bmi-stellar-source-${TAG}.zip', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  bmi-stellar-source-${TAG}.zip')
          " > "bmi-stellar-source-${TAG}.zip.shake256"
          rm -rf "$STAGE"

      - name: Create build archive
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          STAGE="release-build"
          rm -rf "$STAGE" && mkdir -p "$STAGE/build"
          # The app payload, wherever the adapter put it. Since v80 the
          # project builds with adapter-vercel, whose prerendered output
          # lands in .vercel/output/static/ - "build/" only exists for
          # adapter-static. Either way the zip keeps the historical
          # layout: unzip it and serve the build/ directory statically,
          # no node server required.
          if [ -d build ]; then
            cp -r build/. "$STAGE/build/"
          elif [ -d .vercel/output/static ]; then
            cp -r .vercel/output/static/. "$STAGE/build/"
          else
            echo "FATAL: no app payload found (build/ or .vercel/output/static)" >&2
            exit 1
          fi
          # Content gate: the staged payload must contain a real app
          # entry point, never a folder of stray markdown.
          if [ ! -f "$STAGE/build/index.html" ]; then
            echo "FATAL: staged payload has no build/index.html" >&2
            exit 1
          fi
          # Metadata is unconditionally included. The old
          # "cp payload && cp package.json && cp LICENSE" chain dropped
          # both from every v80 archive: when the first cp failed the
          # && chain short-circuited and the AGPL license vanished
          # from the distributed artifact.
          cp package.json "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          if [ -d docs ]; then
            cp -r docs "$STAGE/"
          fi
          cd "$STAGE" && zip -qr "../bmi-stellar-build-${TAG}.zip" . && cd ..
          # Post-zip content gate: read the archive back and require
          # the app entry point inside the actual zip file.
          if ! unzip -l "bmi-stellar-build-${TAG}.zip" | grep -q "build/index.html"; then
            echo "FATAL: build zip does not contain build/index.html" >&2
            exit 1
          fi
          sha512sum "bmi-stellar-build-${TAG}.zip" > "bmi-stellar-build-${TAG}.zip.sha512sum"
          # night-netrunner-1: the three-digest release contract, the
          # zelynic mature-release lane - SHA-512 (classical) + BLAKE3
          # (b3sum, the fast modern lane) + SHAKE256 (quantum-resistant
          # extensible-output). One sidecar per digest per archive, so
          # a verifier can cross-check any lane independently.
          b3sum "bmi-stellar-build-${TAG}.zip" > "bmi-stellar-build-${TAG}.zip.b3sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          python3 -c "
          import hashlib
          data = open('bmi-stellar-build-${TAG}.zip', 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(f'{h}  bmi-stellar-build-${TAG}.zip')
          " > "bmi-stellar-build-${TAG}.zip.shake256"
          rm -rf "$STAGE"

      # night-netrunner-1: the asset inventory tripwire, the zelynic
      # shape - every archive must carry all three digest sidecars
      # (sha512sum, b3sum, shake256) before the release is created.
      # A missing sibling is a red pipeline with the precise file
      # named, never a silently asset-less release (fail_on_unmatched
      # below guards the upload; this guard names the gap earlier).
      - name: Assert release asset inventory
        env:
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          BROKEN=0
          for kind in source build; do
            ARCHIVE="bmi-stellar-${kind}-${TAG}.zip"
            if [ ! -f "${ARCHIVE}" ]; then
              echo "::error::Missing release archive ${ARCHIVE}"
              BROKEN=1
              continue
            fi
            for suffix in sha512sum b3sum shake256; do
              if [ ! -f "${ARCHIVE}.${suffix}" ]; then
                echo "::error::Missing checksum sibling ${ARCHIVE}.${suffix}"
                BROKEN=1
              fi
            done
          done
          if [ "${BROKEN}" -ne 0 ]; then
            exit 1
          fi
          echo "asset inventory verified: 2 archives, 6 checksum sidecars"

      # night-netrunner-Z1 (C3): the SLSA-shaped attestation lane.
      # Checksum sidecars prove transport integrity but are regenerable
      # by whoever holds the bytes; the GitHub attestation binds each
      # archive to this repository and this workflow run through the
      # OIDC identity (actions/attest-build-provenance, the first-party
      # action, SHA-pinned like every other uses: in this tree). The
      # attestation lives in GitHub's public transparency log
      # (api.github.com/repos/oxyzenQ/bmi/attestations) and is
      # verifiable offline with gh attestation verify - the MITM on the
      # release page now has to also forge the transparency log entry.
      - name: Attest the release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, SHA pin
        with:
          # The two archives are the release payload; the digest
          # sidecars are derived material covered transitively.
          subject-path: |
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4, SHA pin
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            **Artifacts:** [source](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip)
            [build](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip)
          files: |
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip.sha512sum
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip.b3sum
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip.shake256
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip.sha512sum
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip.b3sum
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip.shake256
          # An unmatched file name fails the release instead of logging
          # the "does not match any files" warning that would publish an
          # asset-less release silently.
          fail_on_unmatched_files: true
          # IMMUTABLE-RELEASE FIX (the zelynic night-dragon-maintenance-6
          # shape): create the release as a DRAFT. GitHub's immutable-
          # release feature locks the asset set the moment a release
          # becomes published, and softprops/action-gh-release publishes
          # on creation - so on this repo the v80.0.0-night.1 upload was
          # rejected mid-flight and the published release shipped with
          # zero assets. A draft stays mutable for the whole upload, and
          # the "Publish Release (un-draft)" step below flips it to
          # published only after every asset is in place.
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          # Pre-releases are never marked "latest" - the latest pointer
          # only tracks stable releases. The flags below are re-asserted
          # authoritatively by the un-draft step, the one that actually
          # publishes.
          make_latest: ${{ needs.validate-tag.outputs.prerelease != 'true' }}

      # The un-draft half of the immutable-release fix: flip the draft
      # to published only after every asset has uploaded, setting the
      # prerelease and latest flags explicitly so the post-publish
      # state is exactly what this workflow intends. The final
      # gh release view is the post-condition read - a release still
      # in draft here fails the step, never a silent half-publish.
      - name: Publish Release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${IS_PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease=true --latest=false
          else
            gh release edit "${TAG}" --draft=false --prerelease=false --latest=true
          fi
          echo "--- Published release ---"
          gh release view "${TAG}" --json url,isDraft,isPrerelease,isImmutable --jq '.'
