---
name: Stellar Guard - Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 24
  VERCEL_NODE_RUNTIME: nodejs24.x

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate tag format and classify the release channel
        id: ver
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          # Syntax only: vX.Y.Z (stable) or vX.Y.Z-<suffix> (pre-release).
          # Any '-' after the patch version is the whole pre-release
          # contract - no channel whitelist to maintain, the owner names
          # the suffix (beta.1, night.7, rc.2, whatever) and the release
          # page renders the Pre-release badge by itself.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid tag format: $TAG (expected v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<suffix>)"
            exit 1
          fi
          # The pre-release branch comes FIRST: a glob * crosses '-',
          # so a reversed order would classify every -suffix tag
          # stable (the zelynic night-dragon-1S lesson). After the
          # regex above the only possible '-' is the pre-release
          # separator.
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG does not match package.json v${PACKAGE_VERSION}"
            exit 1
          fi

  release:
    needs: validate-tag
    runs-on: ubuntu-24.04
    # Static build plus archive creation and release upload take ~5-8 min.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Build static project
        shell: bash
        run: |
          set -euo pipefail
          cp svelte.config.js svelte.config.js.vercel
          had_layout_ts=0
          if [ -f src/routes/+layout.ts ]; then
            had_layout_ts=1
            cp src/routes/+layout.ts src/routes/+layout.ts.vercel
          fi
          cleanup() {
            cp svelte.config.js.vercel svelte.config.js
            rm -f svelte.config.js.vercel
            if [ "$had_layout_ts" -eq 1 ]; then
              mv src/routes/+layout.ts.vercel src/routes/+layout.ts
            else
              rm -f src/routes/+layout.ts
            fi
          }
          trap cleanup EXIT
          printf 'export const prerender = true;\n' > src/routes/+layout.ts
          bun run build

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          if [ "${{ needs.validate-tag.outputs.prerelease }}" = "true" ]; then
            # Pre-release notes span from the previous tag of any
            # channel - users testing a pre-release build want the
            # changes since the last build.
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1)
          else
            # Stable notes span from the nearest previous STABLE tag:
            # skipped pre-releases never truncate a stable's changelog
            # (the stable after v80.0.0-night.1 still covers everything
            # since the previous stable release).
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | grep -vE '^v[0-9]+\.[0-9]+\.[0-9]+-' | head -n 1)
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            COMMITS=$(git log "${FIRST_COMMIT}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          {
            echo "CHANGELOG<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Both archive steps follow one contract: the archive must contain
      # what its name promises, verified by reading the finished zip
      # back. v80.0.0 shipped a build zip holding 12 documentation
      # files and zero application code with a perfectly valid SHA-512
      # - a checksum proves transport integrity, never archive
      # contents - because "cp -r build ... && cp package.json" lost
      # the whole && chain to a missing directory while later "|| true"
      # lines kept the step green. Every fallback below is explicit
      # and every missing artifact is a hard failure, never a silent
      # degradation.
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          STAGE="release-source"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r src "$STAGE/" && cp -r static "$STAGE/" && cp -r scripts "$STAGE/"
          cp -r .github "$STAGE/" 2>/dev/null || true
          cp -r docs "$STAGE/" 2>/dev/null || true
          cp package.json "$STAGE/"
          cp bun.lock "$STAGE/" 2>/dev/null || true
          cp svelte.config.js "$STAGE/" 2>/dev/null || true
          cp vite.config.ts "$STAGE/" 2>/dev/null || true
          cp tsconfig.json "$STAGE/" 2>/dev/null || true
          cp vitest.config.ts "$STAGE/" 2>/dev/null || true
          cp postcss.config.js "$STAGE/" 2>/dev/null || true
          cp eslint.config.js "$STAGE/" 2>/dev/null || true
          cp vercel.json "$STAGE/" 2>/dev/null || true
          cp verify.sh "$STAGE/" 2>/dev/null || true
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/"
          cp SECURITY.md "$STAGE/" 2>/dev/null || true
          cd "$STAGE" && zip -qr "../bmi-stellar-source-${TAG}.zip" . && cd ..
          if ! unzip -l "bmi-stellar-source-${TAG}.zip" | grep -q "package.json"; then
            echo "FATAL: source zip does not contain package.json" >&2
            exit 1
          fi
          sha512sum "bmi-stellar-source-${TAG}.zip" > "bmi-stellar-source-${TAG}.zip.sha512sum"
          rm -rf "$STAGE"

      - name: Create build archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          STAGE="release-build"
          rm -rf "$STAGE" && mkdir -p "$STAGE/build"
          # The app payload, wherever the adapter put it. Since v80 the
          # project builds with adapter-vercel, whose prerendered output
          # lands in .vercel/output/static/ - "build/" only exists for
          # adapter-static. Either way the zip keeps the historical
          # layout: unzip it and serve the build/ directory statically,
          # no node server required.
          if [ -d build ]; then
            cp -r build/. "$STAGE/build/"
          elif [ -d .vercel/output/static ]; then
            cp -r .vercel/output/static/. "$STAGE/build/"
          else
            echo "FATAL: no app payload found (build/ or .vercel/output/static)" >&2
            exit 1
          fi
          # Content gate: the staged payload must contain a real app
          # entry point, never a folder of stray markdown.
          if [ ! -f "$STAGE/build/index.html" ]; then
            echo "FATAL: staged payload has no build/index.html" >&2
            exit 1
          fi
          # Metadata is unconditionally included. The old
          # "cp payload && cp package.json && cp LICENSE" chain dropped
          # both from every v80 archive: when the first cp failed the
          # && chain short-circuited and the AGPL license vanished
          # from the distributed artifact.
          cp package.json "$STAGE/"
          cp LICENSE "$STAGE/"
          cp README.md "$STAGE/"
          if [ -d docs ]; then
            cp -r docs "$STAGE/"
          fi
          cd "$STAGE" && zip -qr "../bmi-stellar-build-${TAG}.zip" . && cd ..
          # Post-zip content gate: read the archive back and require
          # the app entry point inside the actual zip file.
          if ! unzip -l "bmi-stellar-build-${TAG}.zip" | grep -q "build/index.html"; then
            echo "FATAL: build zip does not contain build/index.html" >&2
            exit 1
          fi
          sha512sum "bmi-stellar-build-${TAG}.zip" > "bmi-stellar-build-${TAG}.zip.sha512sum"
          rm -rf "$STAGE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4, SHA pin
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            **Artifacts:** [source](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip)
            [build](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.TAG_NAME }}/bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip)
          files: |
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip
            bmi-stellar-source-${{ steps.tag.outputs.TAG_NAME }}.zip.sha512sum
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip
            bmi-stellar-build-${{ steps.tag.outputs.TAG_NAME }}.zip.sha512sum
          # An unmatched file name fails the release instead of logging
          # the "does not match any files" warning that would publish an
          # asset-less release silently.
          fail_on_unmatched_files: true
          # IMMUTABLE-RELEASE FIX (the zelynic night-dragon-maintenance-6
          # shape): create the release as a DRAFT. GitHub's immutable-
          # release feature locks the asset set the moment a release
          # becomes published, and softprops/action-gh-release publishes
          # on creation - so on this repo the v80.0.0-night.1 upload was
          # rejected mid-flight and the published release shipped with
          # zero assets. A draft stays mutable for the whole upload, and
          # the "Publish Release (un-draft)" step below flips it to
          # published only after every asset is in place.
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          # Pre-releases are never marked "latest" - the latest pointer
          # only tracks stable releases. The flags below are re-asserted
          # authoritatively by the un-draft step, the one that actually
          # publishes.
          make_latest: ${{ needs.validate-tag.outputs.prerelease != 'true' }}

      # The un-draft half of the immutable-release fix: flip the draft
      # to published only after every asset has uploaded, setting the
      # prerelease and latest flags explicitly so the post-publish
      # state is exactly what this workflow intends. The final
      # gh release view is the post-condition read - a release still
      # in draft here fails the step, never a silent half-publish.
      - name: Publish Release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${IS_PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease=true --latest=false
          else
            gh release edit "${TAG}" --draft=false --prerelease=false --latest=true
          fi
          echo "--- Published release ---"
          gh release view "${TAG}" --json url,isDraft,isPrerelease,isImmutable --jq '.'
