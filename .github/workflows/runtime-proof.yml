---
name: Stellar Guard - Runtime Proof

on:
  # A measurement, not a promise: the runtime claims are proven live on
  # a schedule and on demand, outside the per-push CI lane so the
  # ten-minute CI budget law stays intact.
  schedule:
    # Weekly at 04:00 UTC on Sunday (11:00 WIB), one hour after the
    # shared guardian anchor.
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: runtime-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  runtime-proof:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Resolve pinned Bun version
        id: bun-version
        run: |
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Download and verify the pinned browser binary
        run: bash scripts/proof/download-chrome.sh

      - name: AXP1-ZnQ apt mirror pick (repos-for-ci)
        run: |
          set -euo pipefail
          # AXP1-ZnQ (Architect's eXecution Protocol 1) resolver walks
          # the repos-for-ci catalog and hands back the first address
          # that actually answers (line 1 down, the lane moves on -
          # line 5 answering is the one the lane uses). Exit 1 with no
          # live address - a dead default is never a fallback. The
          # repoint lands before apt-get update, so this lane pulls
          # its shared libraries from a tested mirror, never a
          # hardcoded default the tree prays for.
          MIRROR="$(python3 scripts/ci/axp1znq_resolve.py \
            --file repos-for-ci/apt-mirrors.txt \
            --probe-path dists/resolute/InRelease \
            --first)"
          sudo sed -i "s|mirror+file:/etc/apt/apt-mirrors.txt|${MIRROR}/|g" \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo sed -i "s|http://azure.archive.ubuntu.com/ubuntu/|${MIRROR}/|g" \
            /etc/apt/sources.list 2>/dev/null || true
          echo "AXP1-ZnQ picked: ${MIRROR}"

      - name: Install the shared libraries headless-shell needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libatspi2.0-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
          # The alsa package renamed across Ubuntu majors; either satisfies.
          for pkg in libasound2t64 libasound2; do
            sudo apt-get install -y "$pkg" 2>/dev/null || true
          done

      - name: Verify every shared library resolves (fail-closed)
        run: |
          missing="$(ldd scripts/proof/.chrome/chrome-headless-shell-linux64/chrome-headless-shell | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "unresolved shared libraries:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "all shared libraries resolved"

      - name: Run the runtime proofs
        run: |
          set -o pipefail
          bash scripts/proof/run-proof.sh proof-report.json | tee proof-log.txt

      - name: Upload the proof report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, SHA pin
        with:
          name: runtime-proof-report
          path: |
            proof-report.json
            proof-log.txt
          if-no-files-found: error
          retention-days: 30
