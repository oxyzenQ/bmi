---
name: Stellar Guard - Dependency Maintenance

on:
  schedule:
    # Weekly at 03:00 UTC every Sunday (10:00 WIB), the shared guardian
    # anchor. security-audit.yml keeps a +30 min offset to audit the
    # refreshed lockfile this workflow commits.
    - cron: '0 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

env:
  OWNER_NAME: github-actions[bot]
  OWNER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  BASE_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 26
  VERCEL_NODE_RUNTIME: nodejs26.x
  # Single source of truth for the Rust engine toolchain version (the
  # zelynic Dragon Guard lineage). Kept in sync with
  # engine/argon2id/rust-toolchain.toml and engine/argon2id/Cargo.toml
  # rust-version by scripts/gates/check-rust-version-sync.sh - bump all
  # three surfaces in the same change.
  RUST_VERSION: '1.100.0'

jobs:
  validate:
    name: Maintenance deps weekly validate
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Audit current dependency tree (informational, non-blocking)
        # Non-blocking on purpose: this audit runs BEFORE the update step.
        # If a CVE already exists in the lockfile, blocking here would
        # prevent the weekly update from running — which is the very job
        # that should fix the CVE. The post-update audit (below) is also
        # non-blocking. The authoritative quality gate is the
        # "Run quality checks" step which runs type-check + tests on the
        # updated lockfile before commit.
        run: bun run audit:deps || true

      - name: Update all dependencies
        run: |
          echo "Updating dependencies..."
          bun update --lockfile-only
          git restore --worktree --staged -- package.json
          echo "Checking for security vulnerabilities..."
          bun audit || true

      # AXP1-ZnQ (Architect's eXecution Protocol 1), the address refresh
      # (night-learning-into-darkness-1): the whole repos-for-ci catalog
      # is re-probed after the dependency update - alive AND fresh (the
      # InRelease Date header is the freshness witness, the max-age law)
      # - and the survivors are written back in their authored order,
      # the dead left as dated tombstones, bounded by the 100-line cap,
      # the never-empty guard refusing to erase the owner's pool. The
      # refresh rides AFTER the deps update by the owner's design so the
      # one weekly commit carries both, and it never blocks the ship
      # lane: a critical catalog state warns and names CALL THE OWNER.
      - name: AXP1-ZnQ address refresh (repos-for-ci)
        run: |
          mkdir -p .axp1
          python3 scripts/ci/axp1znq_refresh.py \
            --root repos-for-ci \
            --probe-path dists/resolute/InRelease \
            --note-file .axp1/axp1-address-note.txt

      - name: Enforce dependency-and-catalog diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies and the address catalog are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^(bun\.lock|repos-for-ci/)' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify bun.lock and repos-for-ci/"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run quality checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Running type checking..."
          bun run format:check
          bun run audit:loc
          bun run audit:headers
          bun run audit:pwa-offline
          bun run type-check

          echo "Running linter..."
          bun run lint

          echo "Running tests..."
          bun run test:ci

      - name: Build project
        if: steps.changes.outputs.changed == 'true'
        run: bun run build

      - name: Upload validated maintenance tree
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, SHA pin
        with:
          name: validated-maintenance-tree
          path: |
            bun.lock
            repos-for-ci
            .axp1
          if-no-files-found: error

  commit:
    name: Maintenance deps weekly commit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: false

      - name: Download validated maintenance tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, SHA pin
        with:
          name: validated-maintenance-tree
          path: .auto-update

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          cp .auto-update/bun.lock bun.lock
          # The AXP1-ZnQ (Architect's eXecution Protocol 1) catalog
          # lands beside the lockfile: the one weekly commit carries
          # deps AND addresses, the owner's single-commit contract.
          cp .auto-update/repos-for-ci/*.txt repos-for-ci/

          if git diff --quiet; then
            echo "Validated lockfile is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^(bun\.lock|repos-for-ci/)' /tmp/changed-files.txt; then
            echo "::error::Commit job may only modify bun.lock and repos-for-ci/"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git add repos-for-ci/*.txt
          # The commit title names what actually moved (the lockfile
          # lane, or an address-catalog-only week), and the refresher's
          # note lands in the body the same way the sweep note does -
          # the log keeps the address audit trail readable.
          note_file=".auto-update/.axp1/axp1-address-note.txt"
          title="chore(deps): maintenance deps weekly"
          body="Automated weekly lockfile refresh."
          if ! git diff --name-only | grep -q '^bun\.lock$'; then
            title="chore(deps): maintenance address catalog weekly"
            body="Automated weekly AXP1-ZnQ (Architect's eXecution Protocol 1) address refresh."
          fi
          if [ -f "$note_file" ]; then
            body="${body}"$'\n'"$(cat "$note_file")"
          fi
          git commit -m "$title" \
            -m "$body" \
            -m "Validated before commit with read-only token."
          git push origin "HEAD:${BASE_BRANCH}"

  rust-validate:
    name: Rust engine maintenance validate
    # The zelynic Dragon Guard port for the one Rust seat in the tree
    # (engine/argon2id): the weekly sweep walks every committed Cargo
    # workspace through scripts/ci/sweep-rust-workspaces.sh, then proves
    # the moved lane before anything may commit - formatting, clippy
    # strict, and the wasm artifact parity gate. The parity gate is the
    # fail-closed heart of this job: a dependency bump CAN change the
    # built wasm bytes, and the embedded artifact
    # (src/lib/utils/kdf-wasm-embedded.ts) rides the app bundle and the
    # proof claims - its ONE writer is the owner's deliberate
    # `wasm-provenance.sh --refresh` flow, never this sweep. A sweep that
    # cannot prove artifact parity fails loudly instead of shipping.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and engine target tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, SHA pin
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/argon2id/target
          key: ${{ runner.os }}-cargo-maintenance-${{ hashFiles('engine/argon2id/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-maintenance-

      - name: Rust version sync gate
        run: bash scripts/gates/check-rust-version-sync.sh

      - name: Sweep the Rust dependency lane
        run: bash scripts/ci/sweep-rust-workspaces.sh

      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The rust dependency lane is already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^engine/argon2id/Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify engine/argon2id/Cargo.lock"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rust formatting gate
        if: steps.changes.outputs.changed == 'true'
        run: (cd engine/argon2id && cargo fmt --all -- --check)

      - name: Rust clippy gate
        if: steps.changes.outputs.changed == 'true'
        run: (cd engine/argon2id && cargo clippy --all-targets -- -D warnings)

      - name: Install cargo-deny (digest-pinned scanner)
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/ci/install-cargo-deny.sh

      - name: Dependency policy gate (bans and sources)
        if: steps.changes.outputs.changed == 'true'
        run: (cd engine/argon2id && cargo deny check bans sources)

      - name: Wasm artifact parity gate
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/ci/wasm-provenance.sh

      - name: Upload validated rust lockfile
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, SHA pin
        with:
          name: validated-rust-lock
          path: engine/argon2id/Cargo.lock
          if-no-files-found: error

  rust-commit:
    name: Rust engine maintenance commit
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: rust-validate
    if: needs.rust-validate.outputs.changed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin
        with:
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: false

      - name: Download validated rust lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, SHA pin
        with:
          name: validated-rust-lock
          path: .auto-update

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          # The exact-path staging wall: the lockfile lands from the
          # artifact at its own workspace path, and the commit may carry
          # exactly the locks the sweep walked (scripts/ci/
          # sweep-rust-workspaces.sh --print-locks is the same discovery
          # law the update step swept with - one source of truth, never
          # a glob), so no staging directory can ever ride the commit.
          cp .auto-update/Cargo.lock engine/argon2id/Cargo.lock

          if git diff --quiet; then
            echo "Validated rust lockfile is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '^engine/argon2id/Cargo\.lock$' /tmp/changed-files.txt; then
            echo "::error::Commit job may only modify engine/argon2id/Cargo.lock"
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/ci/sweep-rust-workspaces.sh --print-locks | xargs -r git add --
          git commit -m "chore(deps): rust engine maintenance weekly" \
            -m "Automated weekly Cargo.lock refresh for engine/argon2id." \
            -m "Validated before commit: formatting, clippy strict, wasm artifact parity."
          git push origin "HEAD:${BASE_BRANCH}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
