---
name: Stellar Guard - Security Audit

on:
  schedule:
    # Weekly at 03:30 UTC every Sunday (10:30 WIB), 30 minutes AFTER the
    # shared Sunday 10:00 WIB guardian anchor (maintenance.yml at 03:00
    # UTC): the weekly deps refresh validates and commits its bun.lock
    # roughly 03:05-03:10 UTC, so an audit firing at the anchor would
    # check out the PRE-refresh lockfile and could red on an advisory
    # the refresh had already fixed. 03:30 audits the refreshed tree.
    # Daily cadence caused notif floods during dormant periods whenever
    # a new CVE was published between weekly maintenance windows.
    - cron: '30 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 26
  VERCEL_NODE_RUNTIME: nodejs26.x

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, SHA pin
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve Bun version
        id: bun-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').packageManager?.match(/^bun@(.+)$/)?.[1] || ''")"
          if [ -z "$version" ]; then
            echo "package.json packageManager must be bun@<version>" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, SHA pin
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun run audit:deps

      - name: LOC policy audit
        run: bun run audit:loc

      - name: Header policy audit
        run: bun run audit:headers

      - name: PWA offline-shell audit
        run: bun run audit:pwa-offline

  rust-engine-audit:
    name: Rust Engine Advisory Audit
    # The zelynic Dragon Guard audit shape for the one Rust seat in the
    # tree (engine/argon2id): the advisory DB refreshes every run against
    # a pinned scanner, so red means a new advisory, never a new scanner
    # release. Observation-only on purpose (continue-on-error below, the
    # zelynic posture): a finding is the owner's morning signal, not a
    # blocked push - the --deny warnings flag still makes every finding
    # exit non-zero and annotate loudly instead of scrolling past as
    # yellow text.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, SHA pin

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # @stable, SHA pin

      - name: Install cargo-audit (pinned 0.22.2)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the engine lockfile
        run: cargo audit --file engine/argon2id/Cargo.lock --deny warnings
